<style>
  :root {
    --purple-900: #1f0e38; --purple-950: #180a2b; --green: #72c02c; --green-hover: #8ad63f;
    --ink: #0a0a0a; --muted: rgba(255,255,255,.62); --line: rgba(255,255,255,.14); --error: #ff6b81;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--purple-900); color: #fff; font-family: 'Inter', system-ui, sans-serif;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 32px 32px; background-position: center;
  }
  main { width: min(100%, 360px); display: grid; gap: 28px; justify-items: center; text-align: center; }
  .heart { width: 70px; fill: var(--green); }
  .heart rect { animation: pop .5s cubic-bezier(.16,1,.3,1) backwards; }
  .heart rect:nth-child(1){animation-delay:0ms}.heart rect:nth-child(2){animation-delay:18ms}.heart rect:nth-child(3){animation-delay:36ms}.heart rect:nth-child(4){animation-delay:54ms}.heart rect:nth-child(5){animation-delay:72ms}.heart rect:nth-child(6){animation-delay:90ms}.heart rect:nth-child(7){animation-delay:108ms}.heart rect:nth-child(8){animation-delay:126ms}.heart rect:nth-child(9){animation-delay:144ms}.heart rect:nth-child(10){animation-delay:162ms}.heart rect:nth-child(11){animation-delay:180ms}.heart rect:nth-child(12){animation-delay:198ms}.heart rect:nth-child(13){animation-delay:216ms}.heart rect:nth-child(14){animation-delay:234ms}.heart rect:nth-child(15){animation-delay:252ms}.heart rect:nth-child(16){animation-delay:270ms}.heart rect:nth-child(17){animation-delay:288ms}.heart rect:nth-child(18){animation-delay:306ms}.heart rect:nth-child(19){animation-delay:324ms}.heart rect:nth-child(20){animation-delay:342ms}.heart rect:nth-child(21){animation-delay:360ms}.heart rect:nth-child(22){animation-delay:378ms}.heart rect:nth-child(23){animation-delay:396ms}.heart rect:nth-child(24){animation-delay:414ms}.heart rect:nth-child(25){animation-delay:432ms}.heart rect:nth-child(26){animation-delay:450ms}.heart rect:nth-child(27){animation-delay:468ms}
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
  .eyebrow { margin: 0 0 10px; font: 500 12px/1 'Space Grotesk', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--green); }
  h1 { margin: 0; }
  .logo { display: block; width: 240px; max-width: 100%; height: auto; fill: currentColor; }
  form { width: 100%; display: grid; gap: 12px; }
  label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  input, button { height: 44px; border-radius: 6px; font: 500 15px 'Inter', sans-serif; }
  input {
    width: 100%; padding: 0 14px; color: #fff; background: var(--purple-950);
    border: 1px solid var(--line); outline: none;
  }
  input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(114,192,44,.25); }
  button {
    border: 0; cursor: pointer; background: var(--green); color: var(--ink);
    font: 500 12px 'Space Grotesk', sans-serif; letter-spacing: .14em; text-transform: uppercase;
  }
  button:hover { background: var(--green-hover); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: progress; }
  .remember { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); }
  .remember input { width: 16px; height: 16px; accent-color: var(--green); }
  .remember label { position: static; width: auto; height: auto; clip-path: none; }
  .error { min-height: 20px; margin: 0; font-size: 13px; color: var(--error); }
  @media (prefers-reduced-motion: reduce) { .heart rect { animation: none; } }
</style>

  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const form = document.getElementById('gate'), input = document.getElementById('pw');
  const error = document.getElementById('error'), button = form.querySelector('button');

  async function derive(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  async function show(html) {
    // document.open() is ignored while this page is still being parsed, and
    // write() would then append the site to the password screen. A remembered
    // key can decrypt that early, so wait for parsing to finish.
    if (document.readyState === 'loading') {
      await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
    }
    await new Promise((r) => setTimeout(r));
    // The runtime re-reads the page's own source with fetch(location.href).
    // Here that would return this password screen, so answer it with the
    // decrypted page instead.
    const here = location.origin + location.pathname;
    const realFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      const url = new URL(typeof input === 'string' ? input : input.url, location.href);
      if (url.origin + url.pathname === here) return Promise.resolve(new Response(html, { headers: { 'Content-Type': 'text/html' } }));
      return realFetch(input, init);
    };
    document.open();
    document.write(html);
    document.close();
  }

  // A key remembered from an earlier visit (either page) opens it directly.
  (async () => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (!saved || saved.salt !== SALT) return;
      const key = await crypto.subtle.importKey('raw', bytes(saved.key), 'AES-GCM', false, ['decrypt']);
      await show(await decrypt(key));
    } catch { try { localStorage.removeItem(STORE); } catch {} }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.textContent = '';
    button.disabled = true;
    try {
      const key = await derive(input.value);
      const html = await decrypt(key);
      if (document.getElementById('remember').checked) {
        try {
          const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
          localStorage.setItem(STORE, JSON.stringify({ salt: SALT, key: btoa(String.fromCharCode(...raw)) }));
        } catch {}
      }
      await show(html);
    } catch {
      error.textContent = 'That password didn\u2019t work. Try again.';
      button.disabled = false;
      input.select();
    }
  });
})();
